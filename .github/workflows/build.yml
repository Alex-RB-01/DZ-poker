name: Build Android APK

# 触发：推送到 main/master 分支，或手动在 Actions 页面点 "Run workflow"
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 允许工作流读取代码并上传构建产物（APK）
permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 关闭分析上报
        run: flutter config --no-analytics

      # flutter create 会生成 android/ 平台目录（含 gradle 等二进制），无需本地准备
      - name: 生成 Android 平台文件
        run: flutter create --platforms=android .

      # flutter create 会生成默认的 test/widget_test.dart（Flutter 模板的 counter 冒烟测试），
      # 本项目没有 counter，该测试必然失败；删掉它，只保留我们自己的引擎测试与联机链路测试
      - name: 移除 flutter create 生成的默认测试
        run: rm -f test/widget_test.dart

      # 蓝牙 / 邻近发现所需权限（flutter_nearby_connections 依赖）
      - name: 注入蓝牙/邻近权限到 AndroidManifest
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android.permission.BLUETOOTH_CONNECT' in s:
              print('权限已存在，跳过')
          else:
              perms = '''
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>
              <uses-permission android:name="android.permission.INTERNET"/>'''
              s = s.replace('</manifest>', perms + '\n</manifest>', 1)
              open(p, 'w', encoding='utf-8').write(s)
              print('已注入权限')
          PY

      - name: 获取依赖
        run: flutter pub get

      - name: 静态分析（仅提示，不阻断打包）
        run: flutter analyze || true

      # 联机全链路测试必须通过（客户端下注→房主执行→快照回传），失败则不出包
      - name: 运行测试（联机链路 + 引擎，阻断式）
        run: flutter test

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: poker-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
