name: Build Android APK

# 触发：推送到 main/master 分支，或手动在 Actions 页面点 "Run workflow"
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 允许工作流读取代码并上传构建产物（APK）
permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 关闭分析上报
        run: flutter config --no-analytics

      # flutter create 会生成 android/ 平台目录（含 gradle 等二进制），无需本地准备
      - name: 生成 Android 平台文件
        run: flutter create --platforms=android .

      # 蓝牙 / 邻近发现所需权限（flutter_nearby_connections 依赖）
      - name: 注入蓝牙/邻近权限到 AndroidManifest
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android.permission.BLUETOOTH_CONNECT' in s:
              print('权限已存在，跳过')
          else:
              perms = '''
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>
              <uses-permission android:name="android.permission.INTERNET"/>'''
              s = s.replace('</manifest>', perms + '\n</manifest>', 1)
              open(p, 'w', encoding='utf-8').write(s)
              print('已注入权限')
          PY

      - name: 获取依赖
        run: flutter pub get

      # flutter_nearby_connections 1.1.2 太老，其 android/build.gradle 用了已废弃的
      # jcenter()、缺少 AGP 8 必需的 namespace、且 Java/Kotlin JVM 目标不一致(11 vs 17)。
      # 这里自动修补，保留 LAN 联机功能。
      - name: 修补老旧插件以兼容新版 Gradle/AGP
        run: |
          python3 - <<'PY'
          import re, glob, os
          base = os.path.expanduser('~/.pub-cache/hosted/pub.dev')
          for p in glob.glob(os.path.join(base, 'flutter_nearby_connections-*', 'android', 'build.gradle')):
              s = open(p, encoding='utf-8').read()
              orig = s
              if 'jcenter()' in s:
                  s = s.replace('jcenter()', 'mavenCentral()')
                  print('jcenter -> mavenCentral')
              if 'namespace' not in s:
                  mans = glob.glob(os.path.join(os.path.dirname(p), 'src', 'main', 'AndroidManifest.xml'))
                  if mans:
                      mp = open(mans[0], encoding='utf-8').read()
                      m = re.search(r'package="([^"]+)"', mp)
                      if m:
                          s = s.replace('android {', 'android {\n        namespace "%s"' % m.group(1), 1)
                          print('added namespace', m.group(1))
              # Java 11 vs Kotlin 17 不一致 -> 统一到 17
              for old, new in [('JavaVersion.VERSION_11', 'JavaVersion.VERSION_17'),
                               ('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_17')]:
                  if old in s:
                      s = s.replace(old, new)
                      print('bumped', old, '->', new)
              if 'jvmTarget' not in s:
                  s = s.replace('android {',
                      'android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }', 1)
                  print('added compileOptions/kotlinOptions')
              else:
                  s = re.sub(r"jvmTarget\s*=\s*[\"']?[0-9_.]+[\"']?", "jvmTarget = '17'", s)
                  print('normalized jvmTarget')
              if s != orig:
                  open(p, 'w', encoding='utf-8').write(s)
                  print('patched', p)
              else:
                  print('no change needed', p)
          PY

      - name: 静态分析（仅提示，不阻断打包）
        run: flutter analyze || true

      - name: 运行引擎单元测试（仅提示）
        run: flutter test || true

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: poker-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
